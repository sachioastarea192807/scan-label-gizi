{% extends 'base.html' %}

{% block title %}Ganti Password | Scan Label Gizi{% endblock %}

{% block content %}

<section class="section pt-4">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="profile-card fade-up">

                    <h4 class="mb-1">
                        <i class="bi bi-key-fill text-orange"></i>
                        Ganti Password
                    </h4>

                    <p class="mb-4">Perbarui password akun kamu secara berkala.</p>

                    <form
                        method="POST"
                        action="{{ url_for('profile.change_password') }}"
                        id="changePasswordForm">

                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <!-- ================= PASSWORD LAMA ================= -->

                        <div class="mb-3">
                            <label class="form-label">Password Lama</label>
                            <div class="input-group">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="old_password"
                                    name="old_password"
                                    required>
                                <button class="btn btn-light" type="button" onclick="togglePassword('old_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <hr style="border-top:2px dashed rgba(55,55,31,.2);">

                        <!-- ================= PASSWORD BARU ================= -->

                        <div class="mb-3">
                            <label class="form-label">Password Baru</label>
                            <div class="input-group">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="new_password"
                                    name="new_password"
                                    minlength="6"
                                    required
                                    oninput="checkStrength(); checkMatch();">
                                <button class="btn btn-light" type="button" onclick="togglePassword('new_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div class="pw-strength">
                                <div class="bar" id="bar1"></div>
                                <div class="bar" id="bar2"></div>
                                <div class="bar" id="bar3"></div>
                            </div>
                            <small class="pw-strength-label" id="strengthLabel">Minimal 6 karakter.</small>
                        </div>

                        <!-- ================= KONFIRMASI ================= -->

                        <div class="mb-3">
                            <label class="form-label">Konfirmasi Password Baru</label>
                            <div class="input-group">
                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm_password"
                                    name="confirm_password"
                                    minlength="6"
                                    required
                                    oninput="checkMatch();">
                                <button class="btn btn-light" type="button" onclick="togglePassword('confirm_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div class="pw-match" id="matchIndicator" style="visibility:hidden;">
                                <i class="bi bi-check-circle-fill"></i>
                                <span>Password cocok</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-3 mt-4">

                            <a href="{{ url_for('profile.index') }}" class="btn btn-light">
                                Batal
                            </a>

                            <button type="submit" class="btn btn-warning" id="submitBtn">
                                <i class="bi bi-check-lg"></i>
                                Simpan Password
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}

{% block js %}
<script>

function togglePassword(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}

const newPw = document.getElementById('new_password');
const confirmPw = document.getElementById('confirm_password');
const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
const strengthLabel = document.getElementById('strengthLabel');
const matchIndicator = document.getElementById('matchIndicator');

function passwordScore(value) {
    let score = 0;
    if (value.length >= 6) score++;
    if (value.length >= 10) score++;
    if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;
    return score;
}

function checkStrength() {

    const value = newPw.value;

    bars.forEach(b => b.className = 'bar');

    if (value.length === 0) {
        strengthLabel.textContent = 'Minimal 6 karakter.';
        strengthLabel.style.color = '';
        return;
    }

    const score = passwordScore(value);

    if (score <= 2) {
        bars[0].classList.add('on-weak');
        strengthLabel.textContent = 'Lemah — coba tambahkan angka atau simbol.';
        strengthLabel.style.color = 'var(--danger)';
    } else if (score <= 3) {
        bars[0].classList.add('on-medium');
        bars[1].classList.add('on-medium');
        strengthLabel.textContent = 'Sedang — cukup baik.';
        strengthLabel.style.color = 'var(--orange)';
    } else {
        bars[0].classList.add('on-strong');
        bars[1].classList.add('on-strong');
        bars[2].classList.add('on-strong');
        strengthLabel.textContent = 'Kuat — password bagus!';
        strengthLabel.style.color = 'var(--success)';
    }

}

function checkMatch() {

    if (confirmPw.value.length === 0) {
        matchIndicator.style.visibility = 'hidden';
        return;
    }

    matchIndicator.style.visibility = 'visible';

    if (newPw.value === confirmPw.value) {
        matchIndicator.className = 'pw-match match-ok';
        matchIndicator.innerHTML = '<i class="bi bi-check-circle-fill"></i><span>Password cocok</span>';
    } else {
        matchIndicator.className = 'pw-match match-bad';
        matchIndicator.innerHTML = '<i class="bi bi-x-circle-fill"></i><span>Password tidak cocok</span>';
    }

}

document.getElementById('changePasswordForm').addEventListener('submit', function (e) {
    if (newPw.value !== confirmPw.value) {
        e.preventDefault();
        checkMatch();
        confirmPw.focus();
    }
});

</script>
{% endblock %}
